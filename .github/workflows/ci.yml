name: 🧪 Lightweight CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-light-tests:
    name: 🐍 Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v7

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 📦 Install lightweight test tools
        run: python -m pip install --upgrade pip build numpy

      - name: ✅ Run unit tests
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v

      - name: 🔎 Run smoke tests
        run: python -m unittest discover -s tests/smoke -p 'test_*.py' -v

      - name: 🧩 Run optional-data tests
        run: python -m unittest discover -s tests/data -p 'test_*.py' -v

      - name: 🧾 Check public release surface
        run: python scripts/check_release.py

      - name: 🧠 Compile Python sources
        run: python -m compileall -q source/navol/navol source/rsl_rl/rsl_rl scripts tests

      - name: 🏋️ Check training command generation
        run: python scripts/train/train_navol.py --dry-run

      - name: 📊 Check evaluation command generation
        run: python scripts/eval/evaluate_benchmark.py --dry-run

      - name: 🛞 Build NavOL wheel
        run: python -m build --wheel source/navol --outdir dist

      - name: 📋 Inspect wheel contents
        shell: python {0}
        run: |
          import pathlib
          import zipfile

          wheels = list(pathlib.Path("dist").glob("navol-*.whl"))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          required = {
              "navol/__init__.py",
              "navol/paths.py",
              "navol/training.py",
              "navol/evaluation/metrics.py",
              "navol/tasks/manager_based/navdp/mdp/actions.py",
              "navol/wrapper/dp_env_wrapper.py",
          }
          missing = required - names
          assert not missing, f"wheel is missing: {sorted(missing)}"
          metadata = [name for name in names if name.endswith(".dist-info/METADATA")]
          assert len(metadata) == 1, metadata
          licenses = [name for name in names if name.endswith(".dist-info/licenses/LICENSE")]
          assert len(licenses) == 1, licenses
          notices = [
              name for name in names
              if name.endswith(".dist-info/licenses/THIRD_PARTY_NOTICES.md")
          ]
          assert len(notices) == 1, notices
